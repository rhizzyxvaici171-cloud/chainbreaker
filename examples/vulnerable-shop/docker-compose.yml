services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      # "the deploy bot needs this to restart containers"
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop_admin_pw
