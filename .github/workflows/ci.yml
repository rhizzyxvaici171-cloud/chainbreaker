name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the vulnerable demo with the action itself
        uses: ./
        with:
          path: examples/vulnerable-shop
          fail-on: none
      - uses: actions/upload-artifact@v4
        with:
          name: chainbreaker-demo-report
          path: |
            chainbreaker-report.html
            chainbreaker.sarif

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ChainBreaker scans its own code
        uses: ./
        with:
          exclude: examples,tests
          fail-on: low
